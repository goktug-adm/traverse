<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />
  <title>Traverse — 3D Travel Tracker</title>
</head>
<body>
  <div id="app">
    <div id="globe"></div>
    <div id="vignette"></div>

    <header id="topbar">
      <div class="brand glass">
        <span class="brand-icon">🌍</span>
        <div class="brand-text">
          <h1>Traverse</h1>
          <span class="tagline">your world, in 3D</span>
        </div>
      </div>
      <div class="searchbox glass">
        <span class="search-icon">🔎</span>
        <input id="search" type="text" list="country-list" placeholder="Search a country…" autocomplete="off" />
        <datalist id="country-list"></datalist>
      </div>
      <div id="stats" class="stats glass"></div>
    </header>

    <div id="toolbar" class="glass">
      <button id="btn-add-place" class="tool" data-tip="Add a place — click the globe to drop a pin"><span>📍</span></button>
      <button id="btn-library" class="tool" data-tip="Library — all your photos, country by country"><span>🖼️</span></button>
      <div class="dock-sep"></div>
      <button id="btn-export" class="tool" data-tip="Export your travels as JSON"><span>💾</span></button>
      <button id="btn-import" class="tool" data-tip="Import travels from JSON"><span>📂</span></button>
      <input id="import-file" type="file" accept="application/json" hidden />
      <input id="photo-file" type="file" accept="image/*" multiple hidden />
    </div>

    <div id="hint" class="hint glass">Drag to spin · scroll to zoom · <b>gold badges are the world's top cities</b></div>

    <aside id="panel" class="panel">
      <div id="panel-content"></div>
    </aside>
    <button id="panel-handle" title="Panel">❮</button>

    <div id="photo-modal" class="modal hidden">
      <img id="photo-full" alt="" />
    </div>

    <div id="place-modal" class="modal hidden">
      <div class="modal-box small">
        <div class="modal-head">
          <h2>📍 New place</h2>
          <button id="place-close" class="close">✕</button>
        </div>
        <form id="place-form">
          <label>Name <input id="place-name" type="text" required placeholder="e.g. That tiny ramen bar" /></label>
          <label>Rating
            <div id="place-stars" class="stars"></div>
          </label>
          <label>Notes <textarea id="place-notes" rows="3" placeholder="Why is this spot special?"></textarea></label>
          <div id="place-coords" class="coords"></div>
          <button type="submit" class="primary">Save place</button>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
