<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />
  <title>Traverse — 3D Travel Tracker</title>
</head>
<body>
  <div id="app">
    <div id="globe"></div>

    <header id="topbar">
      <div class="brand">
        <span class="brand-icon">🌍</span>
        <div class="brand-text">
          <h1>Traverse</h1>
          <span class="tagline">your world, in 3D</span>
        </div>
      </div>
      <div class="searchbox">
        <input id="search" type="text" list="country-list" placeholder="Search a country…" autocomplete="off" />
        <datalist id="country-list"></datalist>
      </div>
      <div id="stats" class="stats"></div>
    </header>

    <div id="toolbar">
      <button id="btn-add-place" class="tool" title="Click the globe to drop a pin at your favourite spot">📍 Add place</button>
      <button id="btn-monuments" class="tool active" title="Show 3D monuments on the globe">🏛️ Monuments</button>
      <button id="btn-all-monuments" class="tool" title="Show every country's monument (heavier on the GPU)">🌐 All</button>
      <button id="btn-export" class="tool" title="Download your travel data as JSON">⬇ Export</button>
      <button id="btn-import" class="tool" title="Restore travel data from a JSON file">⬆ Import</button>
      <input id="import-file" type="file" accept="application/json" hidden />
    </div>

    <div id="hint" class="hint">Drag to spin · Scroll to zoom · Click a country to begin</div>

    <aside id="panel" class="panel">
      <div id="panel-content"></div>
    </aside>

    <div id="viewer-modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-head">
          <div>
            <h2 id="viewer-title"></h2>
            <span id="viewer-sub"></span>
          </div>
          <button id="viewer-close" class="close">✕</button>
        </div>
        <div id="viewer-canvas"></div>
        <div class="modal-foot">Stylized low-poly interpretation · drag to orbit, scroll to zoom</div>
      </div>
    </div>

    <div id="place-modal" class="modal hidden">
      <div class="modal-box small">
        <div class="modal-head">
          <h2>📍 New place</h2>
          <button id="place-close" class="close">✕</button>
        </div>
        <form id="place-form">
          <label>Name <input id="place-name" type="text" required placeholder="e.g. That tiny ramen bar" /></label>
          <label>Rating
            <div id="place-stars" class="stars"></div>
          </label>
          <label>Notes <textarea id="place-notes" rows="3" placeholder="Why is this spot special?"></textarea></label>
          <div id="place-coords" class="coords"></div>
          <button type="submit" class="primary">Save place</button>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
